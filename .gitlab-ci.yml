stages:
  - test
  - analyze
  - build
  - deploy

variables:
  IMAGE: "$CI_REGISTRY_IMAGE"
  TAG: "$CI_COMMIT_SHORT_SHA"
  SERVICE_NAME: "dns-encrypted-proxy"

test:
  stage: test
  image: alpine:latest
  tags:
    - docker
  before_script:
    - apk add --no-cache cmake make gcc musl-dev curl-dev openssl-dev cmocka-dev pkgconfig python3 autoconf automake libtool git
    - git clone --depth 1 https://git.airies.net/vifair22/c-log /tmp/c-log
    - git clone --depth 1 -b v1.12.0 https://github.com/ngtcp2/ngtcp2 /tmp/ngtcp2
    - cd /tmp/ngtcp2
    - autoreconf -fi
    - ./configure --enable-lib-only --with-openssl
    - make -j"$(nproc)"
    - make install
    - export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/pkgconfig
    - export LD_LIBRARY_PATH=/usr/local/lib
    - cd "$CI_PROJECT_DIR"
  script:
    - sh tools/ci_test_matrix.sh
  artifacts:
    when: on_failure
    paths:
      - build/matrix/
    expire_in: 1 week

analyze:
  stage: analyze
  image: alpine:latest
  tags:
    - docker
  needs:
    - test
  before_script:
    - apk add --no-cache cmake make gcc musl-dev curl-dev openssl-dev cmocka-dev pkgconfig clang-extra-tools cppcheck git bash
    - git clone --depth 1 https://git.airies.net/vifair22/c-log /tmp/c-log
  script:
    # cppcheck and stack-usage gate; lint is advisory and surfaces findings
    # without failing the job (clang-tidy ≥ 18 returns non-zero on any
    # finding; existing backlog tracked separately).
    - cmake -S . -B build/analyze
        -DCMAKE_BUILD_TYPE=Debug
        -DC_LOG_PATH=/tmp/c-log
        -DENABLE_ANALYZER=ON
        -DENABLE_STACK_USAGE_CHECK=ON
        -DENABLE_UPSTREAM_DOQ=OFF
    - cmake --build build/analyze -j
    - cmake --build build/analyze --target cppcheck
    - cmake --build build/analyze --target stack-usage
    - cmake --build build/analyze --target lint
  allow_failure: false

coverage:
  stage: analyze
  image: alpine:latest
  tags:
    - docker
  needs:
    - test
  before_script:
    - apk add --no-cache cmake make gcc musl-dev curl-dev openssl-dev cmocka-dev pkgconfig gcovr git
    - git clone --depth 1 https://git.airies.net/vifair22/c-log /tmp/c-log
  script:
    # Coverage build runs the full ctest suite under gcov instrumentation,
    # then gcovr enforces the line-coverage threshold (default 80%, set
    # via -DCOVERAGE_LINE_THRESHOLD on the configure line).
    - cmake -S . -B build/coverage
        -DCMAKE_BUILD_TYPE=Debug
        -DC_LOG_PATH=/tmp/c-log
        -DENABLE_COVERAGE=ON
        -DENABLE_UPSTREAM_DOQ=OFF
    - cmake --build build/coverage -j
    - cmake --build build/coverage --target coverage
  artifacts:
    when: always
    paths:
      - build/coverage/coverage.html
      - build/coverage/coverage.*.html
    expire_in: 1 week
  allow_failure: false

build:
  stage: build
  image: docker:24
  tags:
    - docker
    - unraid
  script:
    - docker info
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker build --pull --build-arg C_LOG_CACHE_BUST="$CI_PIPELINE_ID" -t "$IMAGE:$TAG" .
    - docker run -d --rm --name dns-encrypted-proxy-smoke "$IMAGE:$TAG"
    - sleep 2
    - test -n "$(docker ps --filter name=dns-encrypted-proxy-smoke -q)"
    - docker stop dns-encrypted-proxy-smoke
    - docker push "$IMAGE:$TAG"
  needs:
    - test

generate_deploy_child_pipeline:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
    - unraid
  script:
    - apk add --no-cache python3
    - |
      set -euo pipefail
      : "${UNRAID_DEPLOY_TARGETS:?UNRAID_DEPLOY_TARGETS is not set}"

      python3 - <<'PY'
      import os, sys, time

      targets_raw = os.environ.get("UNRAID_DEPLOY_TARGETS", "")
      if not targets_raw.strip():
        print("UNRAID_DEPLOY_TARGETS is empty", file=sys.stderr)
        sys.exit(1)

      targets = []
      for ln in targets_raw.splitlines():
        ln = ln.strip()
        if not ln or ln.startswith("#"):
          continue
        parts = [p.strip() for p in ln.split("|")]
        if len(parts) != 3 or any(not p for p in parts):
          print(f"Bad line in UNRAID_DEPLOY_TARGETS: {ln!r}", file=sys.stderr)
          print("Expected: <UNRAID_HOST>|<DOCKER_NETWORK>|<CONTAINER_IP>", file=sys.stderr)
          sys.exit(1)
        targets.append(parts)

      def q(s: str) -> str:
        return '"' + s.replace("\\\\", "\\\\\\\\").replace('"', '\\"') + '"'

      out = []
      out.append("stages: [deploy]")
      out.append("")

      for i, (host, net, ip) in enumerate(targets):
        out.append(f"deploy_{i}:")
        out.append("  stage: deploy")
        out.append("  image: alpine:latest")
        out.append("  tags: [docker, unraid]")
        out.append("  variables:")
        out.append(f"    UNRAID_HOST: {q(host)}")
        out.append(f"    DOCKER_NET: {q(net)}")
        out.append(f"    CONTAINER_IP: {q(ip)}")
        out.append("  before_script:")
        out.append("    - apk add --no-cache openssh-client")
        out.append("    - mkdir -p ~/.ssh")
        out.append('    - echo "$UNRAID_SSH_KEY" > ~/.ssh/id_rsa')
        out.append("    - chmod 600 ~/.ssh/id_rsa")
        out.append('    - ssh-keyscan "$UNRAID_HOST" >> ~/.ssh/known_hosts')
        out.append("  script:")
        out.append("    - |")
        out.append('      ssh root@"$UNRAID_HOST" <<EOF')
        out.append("      set -euo pipefail")
        out.append('      echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"')
        out.append('      docker pull "$IMAGE:$TAG"')
        out.append('      docker stop "$SERVICE_NAME" || true')
        out.append('      docker rm "$SERVICE_NAME" || true')
        out.append("")
        out.append("      docker run -d \\")
        out.append('        --name "$SERVICE_NAME" \\')
        out.append("        -l net.unraid.docker.managed=dockerman \\")
        out.append("        --restart unless-stopped \\")
        out.append('        --network "$DOCKER_NET" \\')
        out.append('        --ip "$CONTAINER_IP" \\')
        # The proxy resolves its own upstream hostnames through the container's
        # resolver, which by default is the host's - and the host resolves
        # through Pi-hole, which forwards here. Left alone that is a loop the
        # bootstrap ladder has to unwind on every cold start. Point this one
        # container at the same resolvers the ladder falls back to instead.
        out.append("        --dns 8.8.8.8 \\")
        out.append("        --dns 1.1.1.1 \\")
        out.append("        -v /mnt/cache/appdata/dns-encrypted-proxy:/app/config \\")
        out.append("        -e CACHE_CAPACITY=8192 \\")
        out.append('        "$IMAGE:$TAG"')
        out.append("")
        # Unraid's Docker tab is built from the user templates, not from the
        # running containers, so a container created only by docker run
        # disappears from the UI the moment it is stopped and the only way
        # back is another deploy. Writing the template on every deploy keeps
        # the container startable, stoppable and editable from the UI, and
        # keeps what the UI would recreate identical to what CI just ran.
        out.append("      mkdir -p /boot/config/plugins/dockerMan/templates-user")
        out.append("      cat > /boot/config/plugins/dockerMan/templates-user/my-dns-encrypted-proxy.xml <<'TPL'")
        out.append('      <?xml version="1.0"?>')
        out.append('      <Container version="2">')
        out.append("        <Name>dns-encrypted-proxy</Name>")
        out.append('        <Repository>$IMAGE:$TAG</Repository>')
        out.append("        <Registry>https://git.airies.net/vifair22/dns-encrypted-proxy/container_registry</Registry>")
        out.append(f"        <Network>{net}</Network>")
        out.append(f"        <MyIP>{ip}</MyIP>")
        out.append("        <Shell>sh</Shell>")
        out.append("        <Privileged>false</Privileged>")
        out.append("        <Support>https://git.airies.net/vifair22/dns-encrypted-proxy/-/issues</Support>")
        out.append("        <Project>https://git.airies.net/vifair22/dns-encrypted-proxy</Project>")
        out.append("        <ReadMe>https://git.airies.net/vifair22/dns-encrypted-proxy/-/blob/master/Manual.md</ReadMe>")
        out.append("        <Overview>Encrypted DNS forwarding proxy (DoH/DoT) with local cache, bootstrap ladder and Prometheus metrics. Deployed by GitLab CI; this template exists so the container stays manageable from the Docker tab between deploys.</Overview>")
        out.append("        <Category>Network:DNS Network:Privacy</Category>")
        out.append("        <WebUI/>")
        out.append("        <TemplateURL/>")
        out.append("        <Icon/>")
        out.append("        <ExtraParams>--dns 8.8.8.8 --dns 1.1.1.1</ExtraParams>")
        out.append("        <PostArgs/>")
        out.append("        <CPUset/>")
        out.append(f"        <DateInstalled>{int(time.time())}</DateInstalled>")
        out.append("        <DonateText/>")
        out.append("        <DonateLink/>")
        out.append("        <Requires/>")
        out.append('        <Config Name="Config directory" Target="/app/config" Default="/mnt/cache/appdata/dns-encrypted-proxy" Mode="rw" Description="Holds dns-encrypted-proxy.conf; empty means built-in defaults." Type="Path" Display="always" Required="true" Mask="false">/mnt/cache/appdata/dns-encrypted-proxy</Config>')
        out.append('        <Config Name="Cache capacity" Target="CACHE_CAPACITY" Default="8192" Mode="" Description="Answer cache entries." Type="Variable" Display="always" Required="false" Mask="false">8192</Config>')
        out.append('        <Config Name="DNS (UDP)" Target="53" Default="53" Mode="udp" Description="DNS listener." Type="Port" Display="always" Required="true" Mask="false">53</Config>')
        out.append('        <Config Name="DNS (TCP)" Target="53" Default="53" Mode="tcp" Description="DNS listener." Type="Port" Display="always" Required="true" Mask="false">53</Config>')
        out.append('        <Config Name="Metrics" Target="9090" Default="9090" Mode="tcp" Description="Prometheus metrics, /healthz and /readyz." Type="Port" Display="always" Required="false" Mask="false">9090</Config>')
        out.append("      </Container>")
        out.append("      TPL")
        out.append("      EOF")
        out.append("  rules:")
        out.append('    - if: \'$CI_COMMIT_BRANCH == "master"\'')
        out.append("")

      with open("deploy-child.yml", "w", encoding="utf-8") as f:
        f.write("\n".join(out))

      print(f"Generated deploy-child.yml with {len(targets)} job(s).")
      PY
  artifacts:
    paths:
      - deploy-child.yml
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

deploy:
  stage: deploy
  trigger:
    include:
      - artifact: deploy-child.yml
        job: generate_deploy_child_pipeline
    strategy: depend
  needs:
    - generate_deploy_child_pipeline
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
